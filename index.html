<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片颜色可视化分析工具 - 版本选择</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 600px;
            width: 90%;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 30px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }
        
        .version-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin: 30px 0;
        }
        
        .version-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 25px;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .version-card:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }
        
        .version-card h2 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: #fff;
        }
        
        .version-card p {
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 20px;
            line-height: 1.5;
        }
        
        .btn {
            display: inline-block;
            padding: 12px 30px;
            background: linear-gradient(45deg, #3498db, #2980b9);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }
        
        .btn:hover {
            background: linear-gradient(45deg, #2980b9, #1f618d);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.4);
        }
        
        .btn-alt {
            background: linear-gradient(45deg, #9b59b6, #8e44ad);
        }
        
        .btn-alt:hover {
            background: linear-gradient(45deg, #8e44ad, #7d3c98);
            box-shadow: 0 5px 15px rgba(155, 89, 182, 0.4);
        }
        
        .footer {
            margin-top: 40px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }
            
            .container {
                padding: 30px;
            }
            
            .version-card {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>图片颜色可视化分析工具</h1>
        <p>选择你喜欢的版本</p>
        
        <div class="version-container">
            <div class="version-card">
                <h2>版本 2.0</h2>
                <p>✨ 星空背景装饰<br>
                🎨 玻璃态设计<br>
                🌟 流星动画效果<br>
                💎 现代化界面</p>
                <a href="index_v2.0.html" class="btn">使用版本 2.0</a>
            </div>
            
            <div class="version-card">
                <h2>版本 1.0</h2>
                <p>⚡ 简洁界面<br>
                🚀 更快的加载速度<br>
                📱 轻量化设计<br>
                💯 核心功能完整</p>
                <a href="index_v1.0.html" class="btn btn-alt">使用版本 1.0</a>
            </div>
        </div>
        
        <div class="footer">
            <p>作者：Ya_Bo | <a href="https://github.com/ilovedianaforever" target="_blank" style="color: rgba(255,255,255,0.8); text-decoration: none;">GitHub</a></p>
        </div>
    </div>
</body>
</html>
